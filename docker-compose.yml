services:
  system_environment:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: system_environment
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
      - ./docker/php/conf.d/app.ini:/usr/local/etc/php/conf.d/99-app.ini:ro
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql_environment:3306/${MYSQL_DATABASE}?serverVersion=8.4.0&charset=utf8mb4"
    depends_on:
      mysql_environment:
        condition: service_healthy
    networks:
      - network_environment

  nginx_environment:
    image: nginx:1.27.5-alpine
    container_name: nginx_environment
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - system_environment
    networks:
      - network_environment

  mysql_environment:
    image: mysql:8.4
    container_name: mysql_environment
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - network_environment

  phpmyadmin_environment:
    image: phpmyadmin:5-apache
    container_name: phpmyadmin_environment
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql_environment
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 128M
    depends_on:
      mysql_environment:
        condition: service_healthy
    networks:
      - network_environment

volumes:
  mysql_data:

networks:
  network_environment:
    driver: bridge
